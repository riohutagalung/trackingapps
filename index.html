<!-- Device detection script: adds body.device-mobile / device-android / device-ios -->
<script>
(function(){
  var ua = navigator.userAgent || navigator.vendor || window.opera || '';
  var isAndroid = /android/i.test(ua);
  var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  var isMobile = isAndroid || isIOS || ('ontouchstart' in window && (screen.width <= 900 || screen.height <= 900));

  if(isMobile) document.body.classList.add('device-mobile');
  if(isAndroid) document.body.classList.add('device-android');
  if(isIOS) document.body.classList.add('device-ios');

  var badge = document.getElementById('mobile-device-badge');
  if (badge) {
    if (isIOS) badge.textContent = 'iOS';
    else if (isAndroid) badge.textContent = 'Android';
    else if (isMobile) badge.textContent = 'Mobile';
    else badge.textContent = 'WEB';
  }
})();
</script>
